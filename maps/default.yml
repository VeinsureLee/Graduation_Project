map:
  size: [25, 25]
  num_agents: 2
  num_goals: 2

  # 25x25 公寓户型：中央横向走廊将上下两区隔开，6 个大小不一的房间经走廊全连通。
  # 上区（行 0-9）：主卧（左大）+ 客厅（右中）；
  # 走廊（行 9-12）：贯通左右，宽 2 格，连接上下所有房间；
  # 下区（行 12-24）：次卧（左大）+ 厨房（中）+ 卫生间（右小）。
  # 主卧与客厅之间有内门直通（适合开放式布局）。
  #
  #   列:   0        13       24
  #   行0   +---------+--------+
  #         |  主 卧  |  客 厅  |   上区
  #   行9   +----+----+---+----+
  #         |      走 廊      |   走廊（2格宽）
  #   行12  +---------+---+---+
  #         |  次 卧  |厨房|卫间|   下区
  #   行24  +---------+---+---+
  #
  rooms:
    # ---- 上区 (rows 0-9) ----
    - id: master_bedroom  # 主卧：rows 0-9, cols 0-13（宽敞）
      top_left: [0, 0]
      size: [10, 14]

    - id: living_room     # 客厅：rows 0-9, cols 13-24
      top_left: [0, 13]
      size: [10, 12]

    # ---- 走廊 (rows 9-12) ----
    - id: hallway         # 走廊：rows 9-12, cols 0-24（2格内宽，贯通全屋）
      top_left: [9, 0]
      size: [4, 25]

    # ---- 下区 (rows 12-24) ----
    - id: bedroom_2       # 次卧：rows 12-24, cols 0-10
      top_left: [12, 0]
      size: [13, 11]

    - id: kitchen         # 厨房：rows 12-24, cols 10-18
      top_left: [12, 10]
      size: [13, 9]

    - id: bathroom        # 卫生间：rows 12-24, cols 18-24（较窄）
      top_left: [12, 18]
      size: [13, 7]

  # 6 扇门，走廊作枢纽，保证全连通；主卧↔客厅额外直通。
  #   行9：主卧↔走廊、客厅↔走廊（横向墙，上下通行）
  #   行12：次卧↔走廊、厨房↔走廊、卫生间↔走廊（横向墙，上下通行）
  #   列13：主卧↔客厅（竖向墙，左右通行）
  doors:
    - position: [9, 6]    # 主卧   <-> 走廊  (共享行 9，居主卧中段)
    - position: [9, 18]   # 客厅   <-> 走廊  (共享行 9，居客厅中段)
    - position: [12, 5]   # 次卧   <-> 走廊  (共享行 12)
    - position: [12, 14]  # 厨房   <-> 走廊  (共享行 12)
    - position: [12, 21]  # 卫生间 <-> 走廊  (共享行 12)
    - position: [5, 13]   # 主卧   <-> 客厅  (共享列 13，内门直通)

  # 固定起点/终点（random_spawn=false 时使用）。
  agents_start: [[4, 5], [16, 4]]   # 主卧、次卧
  goals:        [[4, 20], [16, 14]] # 客厅、厨房
